<!DOCTYPE html>
<html lang="uz" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACHAVAT Music Studio</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Dinamik Orqa Fon -->
    <div class="bg-container">
        <div class="stars-layer" id="starsLayer"></div>
        <div class="landscape-layer" id="landscapeLayer"></div>
        <div class="cyber-glow-1"></div>
        <div class="cyber-glow-2"></div>
        <div class="bg-overlay"></div>
    </div>

    <div class="app-container">
        <!-- Header -->
        <header class="glass-header">
            <div class="logo">
                <i class="fa-solid fa-bolt-lightning neon-icon"></i>
                <span class="highlight">ACHAVAT<span>MUSIC</span></span>
            </div>

            <div class="search-box glass-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Musiqa yoki artistlarni izlang...">
            </div>

            <div class="header-controls">
                <!-- Language Selector -->
                <select id="langSelect" class="glass-box sort-dropdown" title="Tilni tanlash">
                    <option value="uz">UZ</option>
                    <option value="en">EN</option>
                    <option value="ru">RU</option>
                </select>

                <!-- Theme Mode Toggle -->
                <button id="themeToggleBtn" class="glass-box control-icon-btn" title="Rejimni o'zgartirish">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>

                <!-- Sort by Rating/Views -->
                <select id="sortSelect" class="glass-box sort-dropdown">
                    <option value="default">Saralash: Hammasi</option>
                    <option value="rating">⭐ Reyting</option>
                    <option value="plays">🎧 Tinglov</option>
                    <option value="az">🔤 A-Z</option>
                </select>

                <!-- Profile Button (Fixed Avatar ID) -->
                <button id="profileBtn" class="glass-box profile-btn">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150"
                        alt="Avatar" id="headerAvatarImg" class="header-avatar-img" height="30px">
                    <span id="profileName">Profil</span>
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="section-header">
                <h2 class="section-title"><i class="fa-solid fa-fire-flame-curved"></i> <span id="sectionTitleText">Trenddagi Treklar</span></h2>
                <div class="filter-tabs">
                    <button class="tab-btn active" data-filter="all" id="tabAll">Barchasi</button>
                    <button class="tab-btn" data-filter="saved" id="tabSaved">❤️ <span id="savedLabel">Sevimlilar</span> (<span id="savedCount">0</span>)</button>
                    <button class="tab-btn" data-filter="history" id="tabHistory">🕒 <span id="historyLabel">Tarix</span> (<span id="historyCount">0</span>)</button>
                </div>
            </div>

            <!-- Tezkor janr tugmalari -->
            <div class="genre-chips" id="genreChips">
                <button class="genre-chip active" data-query="cyberpunk electronic">Cyberpunk</button>
                <button class="genre-chip" data-query="synthwave retro">Synthwave</button>
                <button class="genre-chip" data-query="lofi chill beats">Lo-Fi</button>
                <button class="genre-chip" data-query="phonk drift">Phonk</button>
                <button class="genre-chip" data-query="uzbek pop hits">Uzbek</button>
            </div>

            <div class="tracks-grid" id="tracksGrid">
                <!-- Musiqalar shu yerga chiqadi -->
            </div>
        </main>
    </div>

    <!-- Profile Modal -->
    <div class="modal-backdrop" id="profileModal">
        <div class="glass-modal glass-box">
            <div class="modal-header">
                <h3><i class="fa-solid fa-user-gear"></i> <span id="profileModalTitle">Profil</span></h3>
                <button id="closeProfileModal" class="close-modal-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <div class="profile-avatar-box" id="avatarContainer" title="Rasmni o'zgartirish uchun bosing">
                    <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" alt="Avatar"
                        id="userAvatarImg">
                    <div class="avatar-overlay">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                </div>
                <!-- Yashirin file input -->
                <input type="file" id="avatarFileInput" accept="image/*" style="display: none;">

                <div class="input-group">
                    <label id="usernameLabel">Foydalanuvchi nomi:</label>
                    <input type="text" id="usernameInput" value="CyberUser_01" class="glass-box">
                </div>

                <div class="stats-box">
                    <div><span id="statSavedLabel">Saqlangan treklar</span>: <span id="statSaved">0</span></div>
                    <div><span id="statListensLabel">Jami tinglovlar</span>: <span id="statListens">1,420</span></div>
                </div>
                <button id="saveProfileBtn" class="cyber-btn">Saqlash</button>
            </div>
        </div>
    </div>

    <!-- Player -->
    <div class="player-container glass-box" id="playerContainer">
        <div class="player-mini" id="playerMini">
            <div class="player-left">
                <img id="modalCover" src="" alt="Cover" class="player-cover">
                <div class="player-info">
                    <div id="modalTitle" class="player-title">Musiqa nomi</div>
                    <div id="modalArtist" class="player-artist">Ijrochi</div>
                </div>
            </div>

            <div class="player-right-mini">
                <button id="prevTrackBtn" class="control-btn secondary mini-btn"><i class="fa-solid fa-backward-step"></i></button>
                <button id="playPauseBtn" class="control-btn"><i id="playIcon" class="fa-solid fa-play"></i></button>
                <button id="nextTrackBtn" class="control-btn secondary mini-btn"><i class="fa-solid fa-forward-step"></i></button>
                <button id="expandPlayerBtn" class="control-btn secondary expand-arrow"><i class="fa-solid fa-chevron-up"></i></button>
            </div>
        </div>

        <div class="player-expanded" id="playerExpanded">
            <!-- Tepaning o'rtasidagi jele-surish tutqichi -->
            <div class="jelly-drag-handle" id="jellyDragHandle" title="Bosib ushlab suring (Jele fizikasi)">
                <span class="jelly-grip-pill"></span>
            </div>

            <div class="expanded-header">
                <button id="collapsePlayerBtn" class="control-btn secondary"><i class="fa-solid fa-chevron-down"></i></button>
                <span id="expandedHeaderText">Full Cyber Player</span>
                <div class="expanded-top-actions">
                    <button id="toggleVisualModeBtn" class="control-btn secondary small-action-btn" title="Rasm va Ustunchalar o'rtasida almashish">
                        <i class="fa-solid fa-chart-simple" id="visualModeIcon"></i>
                    </button>
                    <button id="fullscreenVisualBtn" class="control-btn secondary small-action-btn" title="Ritmni katta ekranga chiqarish">
                        <i class="fa-solid fa-expand"></i>
                    </button>
                    <button id="closePlayerFull" class="control-btn secondary"><i class="fa-solid fa-xmark"></i></button>
                </div>
            </div>

            <div class="expanded-cover-box" id="expandedCoverBox">
                <img id="expandedCover" src="" alt="Cover" class="expanded-cover-img">
                <canvas id="miniVisualizerCanvas" class="mini-visualizer-canvas"></canvas>
            </div>

            <div class="expanded-info">
                <div id="expandedTitle" class="expanded-title">Musiqa nomi</div>
                <div id="expandedArtist" class="expanded-artist">Ijrochi</div>
            </div>

            <div class="volume-row">
                <button id="muteBtn" class="volume-icon-btn" title="Ovozni o'chirish / yoqish">
                    <i class="fa-solid fa-volume-high" id="volumeIcon"></i>
                </button>
                <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="80" title="Ovoz balandligi">
                <span id="volumePercent" class="volume-percent">80%</span>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="time-labels">
                <span id="currentTime">0:00</span>
                <span id="totalDuration">0:30</span>
            </div>

            <div class="expanded-controls">
                <button id="likeTrackBtn" class="control-btn secondary big-like"><i class="fa-regular fa-heart" id="likeIcon"></i></button>
                <button id="expandedPrevBtn" class="control-btn secondary"><i class="fa-solid fa-backward-step"></i></button>
                <button id="expandedPlayBtn" class="control-btn main-play"><i id="expandedPlayIcon" class="fa-solid fa-play"></i></button>
                <button id="expandedNextBtn" class="control-btn secondary"><i class="fa-solid fa-forward-step"></i></button>
                <button id="loopTrackBtn" class="control-btn secondary"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </div>
    </div>

    <!-- To'liq ekran Ritm / Ekvalayzer oynasi -->
    <div class="fullscreen-visualizer-overlay" id="fullscreenVisualizerOverlay">
        <button id="exitFullscreenVisualBtn" class="control-btn secondary exit-fs-btn" title="Kichraytirish">
            <i class="fa-solid fa-compress"></i>
        </button>
        <div class="fs-track-meta">
            <div id="fsTrackTitle" class="fs-track-title">Musiqa nomi</div>
            <div id="fsTrackArtist" class="fs-track-artist">Ijrochi</div>
        </div>
        <canvas id="fullscreenVisualizerCanvas" class="fullscreen-visualizer-canvas"></canvas>
    </div>

    <script src="script.js"></script>
</body>

</html>
